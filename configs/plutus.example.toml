# Example configuration. Copy to plutus.toml in the working directory
# (gitignored) or pass --config. Put the local MySQL DSN in [database].
# The Connection encryption master key must not appear here; use
# PLUTUS_MASTER_KEY or PLUTUS_MASTER_KEY_FILE, including via a gitignored `.env`.

[server]
listen_address = "127.0.0.1"
port = 8080

[server.tls]
https_enabled = false
https_cert_path = ""
https_key_path = ""
mtls_enabled = false
mtls_ca_path = ""

[auth]
registration_enabled = false
session_idle_lifetime = "168h"
session_absolute_lifetime = "720h"

[jobs]
worker_poll_interval = "1s"
lease_duration = "2m"
completed_retention = "2160h"

[collection]
default_interval = "15m"
default_freshness_multiplier = 2

[database]
dsn = "user:password@tcp(127.0.0.1:3306)/plutus"
# allow_reset enables the development-only `plutus db reset` command.
allow_reset = false
