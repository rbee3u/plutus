          type: string
        futuresContractId:
          $ref: "#/components/schemas/UUID"
        futuresSymbol:
          type: string
        kind:
          type: string
        baseAssetSymbol:
          type: [string, "null"]
        quoteAssetSymbol:
          type: [string, "null"]
        settlementAssetSymbol:
          type: [string, "null"]
        expiryAt:
          type: [string, "null"]
          format: date-time
        contractSize:
          $ref: "#/components/schemas/NullableDecimal"
        side:
          type: string
          enum: [long, short]
        positionMode:
          type: [string, "null"]
          enum: [one_way, hedged, null]
        marginSetting:
          type: [string, "null"]
          enum: [cross, isolated, null]
        marginAssetSymbol:
          type: [string, "null"]
        marginBasis:
          type: [string, "null"]
          enum: [initial, allocated, null]
        portfolioMargin:
          type: [boolean, "null"]
        size:
          description: Base quantity for linear contracts or quote face amount for inverse contracts; signed for known one-way positions.
          $ref: "#/components/schemas/NullableDecimal"
        sizeSymbol:
          type: [string, "null"]
        settlementMargin:
          description: Margin in settlement currency, using the position's cross or isolated display basis.
          $ref: "#/components/schemas/NullableDecimal"
        marginSource:
          description: Provenance of the displayed settlement margin; source amounts remain unchanged.
          type: [string, "null"]
          enum: [reported, calculated, null]
        marginUnavailableReason:
          description: Why settlement margin is unknown; optional margin omissions do not affect notional completeness.
          type: [string, "null"]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        sourceQuantity:
          description: Positive source quantity magnitude, retaining the source unit; direction is stored separately.
          $ref: "#/components/schemas/Decimal"
        sourceQuantityUnit:
          type: string
          enum: [contracts, base, quote]
        entryPrice:
          $ref: "#/components/schemas/NullableDecimal"
        markPrice:
          $ref: "#/components/schemas/NullableDecimal"
        liquidationPrice:
          $ref: "#/components/schemas/NullableDecimal"
        unrealizedPnl:
