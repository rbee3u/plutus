openapi: 3.1.0
info:
  title: Plutus API
  version: 0.1.0
  description: Phase 2 transport contract for authentication, portfolios, identities, connections, catalog, observations, and jobs.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process can serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      summary: Process readiness
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthNotReady"
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Issue or rotate a CSRF token
      security: []
      responses:
        "200":
          description: CSRF token for the current pre-auth or session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
  /api/v1/auth/registration-status:
    get:
      operationId: getAuthRegistrationStatus
      tags: [auth]
      summary: Report whether public registration is enabled
      security: []
      responses:
        "200":
          description: Registration flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Register a user when public registration is enabled
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User and default Main portfolio created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Authenticate with username and password
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      tags: [auth]
      summary: Revoke all sessions for the current user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: All sessions revoked.
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current user and session summary
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/password:
    put:
      operationId: putAuthPassword
      tags: [auth]
      summary: Replace the current password
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password replaced.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: List the current user's sessions
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: deleteAuthSession
      tags: [auth]
      summary: Revoke one owned session
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios:
    get:
      operationId: listPortfolios
      tags: [portfolios]
      summary: List owned portfolios
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Portfolios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPortfolio
      tags: [portfolios]
      summary: Create a portfolio
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}:
    get:
      operationId: getPortfolio
      tags: [portfolios]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Portfolio.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchPortfolio
      tags: [portfolios]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPortfolioRequest"
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePortfolio
      tags: [portfolios]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Deleted an empty portfolio.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/archive:
    post:
      operationId: archivePortfolio
      tags: [portfolios]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/restore:
    post:
      operationId: restorePortfolio
      tags: [portfolios]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities:
    get:
      operationId: listIdentities
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIdentity
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}:
    get:
      operationId: getIdentity
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
      responses:
        "200":
          description: Identity.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchIdentity
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchIdentityRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/archive:
    post:
      operationId: archiveIdentity
      tags: [identities]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/connections:
    get:
      operationId: listConnections
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Connections without credential material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConnection
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Created without credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/connections/{connectionId}:
    get:
      operationId: getConnection
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchConnection
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConnectionRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteConnection
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Discovered accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/catalog/assets:
    get:
      operationId: searchCatalogAssets
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: q
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Canonical assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/observations/{observationId}:
    patch:
      operationId: patchObservation
      tags: [observations]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/ObservationID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchObservationRequest"
      responses:
        "200":
          description: Corrected observation and the enqueued projection job.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationCorrection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/capital-baseline:
    get:
      operationId: getCapitalBaseline
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Current capital baseline.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalBaseline"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putCapitalBaseline
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutCapitalBaselineRequest"
      responses:
        "200":
          description: Baseline revised.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalBaselineMutation"
        "201":
          description: Baseline created.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalBaselineMutation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/capital-baseline/revisions:
    get:
      operationId: listCapitalBaselineRevisions
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Baseline revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalBaselineRevisionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/capital-flows:
    get:
      operationId: listCapitalFlows
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Current capital flows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalFlowList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCapitalFlow
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapitalFlowRequest"
      responses:
        "201":
          description: Flow created.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalFlowMutation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/capital-flows/{flowId}:
    get:
      operationId: getCapitalFlow
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/FlowID"
      responses:
        "200":
          description: Current capital flow.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalFlow"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchCapitalFlow
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCapitalFlowRequest"
      responses:
        "200":
          description: Flow revised.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalFlowMutation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCapitalFlow
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Flow marked deleted by a new revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalFlowMutation"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/capital-flows/{flowId}/revisions:
    get:
      operationId: listCapitalFlowRevisions
      tags: [capital]
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/FlowID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Flow revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalFlowRevisionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
