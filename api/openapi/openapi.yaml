components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: plutus_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    PortfolioID:
      name: portfolioId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    IdentityID:
      name: identityId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ConnectionID:
      name: connectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ObservationID:
      name: observationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    FlowID:
      name: flowId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SessionID:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ListingID:
      name: listingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SubjectKind:
      name: subjectKind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CatalogPinSubjectKind"
    SubjectID:
      name: subjectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TimeFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    TimeTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    Granularity:
      name: granularity
      in: query
      schema:
        $ref: "#/components/schemas/TimeGranularity"
    MaxPoints:
      name: maxPoints
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    PeriodKind:
      name: periodKind
      in: query
      schema:
        $ref: "#/components/schemas/CalendarPeriodKind"
  responses:
    Problem:
      description: Problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    UUID:
      type: string
      format: uuid
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    HealthReady:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    HealthNotReady:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [not_ready]
        reason:
          type: string
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthSession:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required: [id, username, status]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, sessionCount]
      properties:
        user:
          $ref: "#/components/schemas/User"
        sessionCount:
          type: integer
          minimum: 0
    Session:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        clientLabel:
          type: [string, "null"]
        current:
          type: boolean
    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    AssetRef:
      type: object
      additionalProperties: false
      required: [id, code]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        code:
          type: string
    Portfolio:
      type: object
      additionalProperties: false
      required: [id, name, timezone, displayAsset, status, undeletable, version, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        timezone:
          type: string
        displayAsset:
          $ref: "#/components/schemas/AssetRef"
        status:
          type: string
          enum: [active, archived]
        undeletable:
          type: boolean
          description: True for the portfolio created with the user. It cannot be deleted.
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
    PortfolioList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
    CreatePortfolioRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
        displayAssetId:
          $ref: "#/components/schemas/UUID"
    PatchPortfolioRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
        displayAssetId:
          $ref: "#/components/schemas/UUID"
    Identity:
      type: object
      additionalProperties: false
      required: [id, portfolioId, platformId, externalRef, displayName, accountMode, kind, status, version]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        portfolioId:
          $ref: "#/components/schemas/UUID"
        platformId:
          $ref: "#/components/schemas/UUID"
        parentIdentityId:
          type: [string, "null"]
          format: uuid
        externalRef:
