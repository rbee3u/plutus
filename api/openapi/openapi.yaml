          notionalUsd,
        ]
      properties:
        displayLeverage:
          type: [string, "null"]
          pattern: '^[0-9]+(\.[0-9]{1,200})?$'
          description: Display-only multiplier retaining up to 200 fractional digits to avoid double rounding at display midpoints. Source financial values remain unchanged. Cross uses positive reported leverage; isolated uses absolute USD notional divided by allocated margin in USD. Portfolio margin has no multiplier except actual isolated positions. Missing inputs return null.
        marginUnavailableCode:
          type: [string, "null"]
          enum:
            [
              setting_unknown,
              account_mode_unknown,
              shared_portfolio_margin,
              setting_unsupported,
              allocated_margin_unavailable,
              reported_margin_invalid,
              reported_margin_unavailable,
              initial_margin_unavailable,
              currency_unknown,
              conversion_unavailable,
              contract_kind_unsupported,
              size_or_quote_unavailable,
              mark_or_leverage_unavailable,
              settlement_mismatch,
              null,
            ]
          description: Stable reason for unavailable settlementMargin; null when known. marginUnavailableReason supplies descriptive context.
