          $ref: "#/components/schemas/NullableDecimal"
        withdrawalsUsd:
          $ref: "#/components/schemas/NullableDecimal"
        boundaryContributionsUsd:
          $ref: "#/components/schemas/NullableDecimal"
        boundaryWithdrawalsUsd:
          $ref: "#/components/schemas/NullableDecimal"
        amountUsd:
          $ref: "#/components/schemas/NullableDecimal"
          description:
            Known adjusted difference when comparable, including incomplete
            results; null when comparison is unavailable. Zero is a known result.
        completeness:
          $ref: "#/components/schemas/Completeness"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        boundaryEvents:
          type: array
          items:
            $ref: "#/components/schemas/BoundaryEvent"
        comparable:
          type: boolean
          description:
            Both endpoints exist and resolve to distinct, ordered valuation
            points.
        flowsCompleteness:
          $ref: "#/components/schemas/Completeness"
          description:
            Completeness of capital and boundary flow amounts. Incomplete when
            comparison is unavailable, a flow is unvalued, or a boundary value is
            only partially known. Independent of endpoint valuation completeness.
