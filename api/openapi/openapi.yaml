        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: plutus_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for state changes, including login. Acquire through auth/csrf; validated explicitly before mutation.
  parameters:
    ListOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    ListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CSRFToken:
      description: Required by the operation security requirement. Missing or invalid tokens return 403 csrf_invalid; the shared browser transport attaches the token.
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional opaque token of at most 255 visible ASCII characters; an empty
        or omitted key disables replay. Successful responses are retained for
        24 hours, scoped to the authenticated user, HTTP method, and path.
        Reusing a key with a different typed JSON body returns 409
        idempotency_conflict. Omitted inputs remain distinct from explicit
        inputs. Authentication and CSRF are checked before replay, including
        after resource deletion. Failed operations are not retained. A replay
        returns the original response; read the resource for its current state.
      schema:
        type: string
        maxLength: 255
        pattern: "^[!-~]*$"
    PortfolioID:
      name: portfolioId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    IdentityID:
      name: identityId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AccountID:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    CycleID:
      name: cycleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    IncludePendingManual:
      name: includePendingManual
      in: query
      schema:
        type: boolean
        default: false
      description: Overlay current manual quantities without changing collected amounts or valuations. The response identifies the ledger versions; cycleId does not freeze these edits.
    ReadCycleID:
      name: cycleId
      in: query
      description:
        Immutable valuation point to read; omitted to resolve the latest
        point once per request. The current point remains readable after the
        public history cutoff. Unknown points return 404; expired detail returns
        410 without substituting another point.
      schema:
        $ref: "#/components/schemas/UUID"
    FlowID:
      name: flowId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SessionID:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AssetID:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TimeFrom:
      name: from
      in: query
      description:
        Start instant in RFC 3339. Each operation documents its own default
        and endpoint inclusion rules.
      schema:
        type: string
        format: date-time
    TimeTo:
      description:
        End instant in RFC 3339. Each operation documents its endpoint
        inclusion rules.
      name: to
      in: query
      schema:
        type: string
        format: date-time
    PeriodKind:
      name: periodKind
      in: query
      schema:
        $ref: "#/components/schemas/PeriodKind"
    EditVersion:
      name: If-Edit-Version
      in: header
      required: true
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]*)$"
      description:
        Expected edit version from the resource being edited. Portfolio,
        identity and capital flow use version; asset mapping uses mappingVersion;
        exclusion uses exclusionVersion; manual balances use the ledger version. Only
        exclusion permits zero.
  responses:
    Problem:
      description: Problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    UUID:
      type: string
      format: uuid
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    HealthReady:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    HealthNotReady:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [not_ready]
        reason:
          type: string
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthSession:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required: [id, username, status]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, sessionCount]
      properties:
        user:
          $ref: "#/components/schemas/User"
        sessionCount:
          type: integer
          minimum: 0
    Session:
      type: object
      additionalProperties: false
      required:
        [id, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        userAgent:
          type: [string, "null"]
        current:
          type: boolean
    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Portfolio:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          timezone,
          collectionIntervalSeconds,
          undeletable,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        deletionRequestedAt:
          type: [string, "null"]
          format: date-time
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        timezone:
          type: string
        collectionIntervalSeconds:
          type: integer
          minimum: 900
          maximum: 86400
        undeletable:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PortfolioList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
    CreatePortfolioRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
        collectionIntervalSeconds:
          type: integer
          minimum: 900
          maximum: 86400
    PatchPortfolioRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
        collectionIntervalSeconds:
          type: integer
          minimum: 900
          maximum: 86400
    Platform:
      type: object
      additionalProperties: false
      required: [id, name, adapterAvailable, accountStructures, credentialForm]
      properties:
        id:
          type: string
        name:
          type: string
        adapterAvailable:
          type: boolean
        accountStructures:
          type: array
          items:
            $ref: "#/components/schemas/AccountStructure"
        credentialForm:
          $ref: "#/components/schemas/CredentialForm"
    CredentialForm:
      type: object
      additionalProperties: false
      description: Existing browser inputs; server credential validation remains authoritative and separate.
      required: [primary, passphrase, help]
      properties:
        primary:
          $ref: "#/components/schemas/CredentialGroup"
        futures:
          $ref: "#/components/schemas/CredentialGroup"
        passphrase:
          type: string
          enum: [hidden, optional, required]
        help:
          type: string
    CredentialGroup:
      type: object
      additionalProperties: false
      required: [keyLabel, secretLabel, secretInput, requirement]
      properties:
        keyLabel:
          type: string
        secretLabel:
          type: string
        secretInput:
          type: string
          enum: [password, multiline]
        requirement:
          $ref: "#/components/schemas/CredentialRequirement"
    CredentialRequirement:
      type: object
      additionalProperties: false
      required: [mode, accountTypes]
      properties:
        mode:
          type: string
          enum: [always, selected, selected_except]
        accountTypes:
          type: array
          items:
            type: string
          description: Selected accounts matching this list (selected) or outside it (selected_except); ignored for always.
    AccountStructure:
      type: object
      additionalProperties: false
      description: >-
        How the platform arranges an identity's accounts. It decides the account types, is chosen
        when the identity is created, and cannot be changed afterwards.
      required: [id, name, accountTypes, marginModes]
      properties:
        id:
          type: string
        name:
          type: string
        accountTypes:
          type: array
          items:
            $ref: "#/components/schemas/AccountTypeInfo"
        marginModes:
          description: Margin modes the platform may report within this structure; empty when it has none.
          type: array
          items:
            $ref: "#/components/schemas/MarginModeInfo"
    AccountTypeInfo:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    MarginModeInfo:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    PlatformList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
    Connection:
      type: object
      additionalProperties: false
      required: [status, credentialsConfigured]
      properties:
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        credentialsConfigured:
          type: boolean
        credentialsSetAt:
          type: [string, "null"]
          format: date-time
        lastValidationSucceededAt:
          type: [string, "null"]
          format: date-time
        lastCollectionFinishedAt:
          type: [string, "null"]
          format: date-time
        lastErrorClass:
          type: [string, "null"]
        lastErrorDetail:
          type: [string, "null"]
    Account:
      type: object
      additionalProperties: false
      required: [id, identityId, accountType, displayName, selected]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        identityId:
          $ref: "#/components/schemas/UUID"
        accountType:
          type: string
        displayName:
          type: string
        selected:
          type: boolean
    Identity:
      type: object
      additionalProperties: false
      required:
        [
          id,
          portfolioId,
          platform,
          displayName,
          accountStructure,
          status,
          connection,
          accounts,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        portfolioId:
          $ref: "#/components/schemas/UUID"
        platform:
          type: string
        displayName:
          type: string
        accountStructure:
          type: string
        marginMode:
          description: >-
            The margin mode the platform last reported. Null before the first successful validation
            and for account structures that have none.
          type: [string, "null"]
        externalRef:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/IdentityStatus"
        archivedAt:
          type: [string, "null"]
          format: date-time
        connection:
          $ref: "#/components/schemas/Connection"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IdentityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
    CreateIdentityRequest:
      type: object
      additionalProperties: false
      required: [platform, displayName, accountStructure, selectedAccountTypes]
      properties:
        platform:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        accountStructure:
          type: string
        selectedAccountTypes:
          type: array
          items:
            type: string
    AccountPatch:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        selected:
          type: boolean
    PatchIdentityRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountPatch"
    PutCredentialsRequest:
      type: object
      additionalProperties: false
      required: [apiKey, apiSecret]
      properties:
        apiKey:
          type: string
          maxLength: 512
        apiSecret:
          type: string
          maxLength: 1024
          description: For Binance, an HMAC secret or an unencrypted PKCS#8 Ed25519 private key PEM; the server detects PEM automatically. Other platforms use their ordinary API secret.
        passphrase:
          type: string
          maxLength: 512
        futuresApiKey:
          type: string
