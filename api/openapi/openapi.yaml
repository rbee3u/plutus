    ValueChange:
      type: object
      additionalProperties: false
      description:
        When comparable is false, amountUsd and all four flow amounts are null.
        Otherwise amounts sum known inputs, including zero, even when incomplete.
      required:
        - periodKind
        - label
        - from
        - to
        - contributionsUsd
        - withdrawalsUsd
        - boundaryContributionsUsd
        - boundaryWithdrawalsUsd
        - completeness
        - issues
        - boundaryEvents
        - amountUsd
        - comparable
        - flowsCompleteness
      properties:
        periodKind:
          type: string
        label:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        startPoint:
          oneOf:
            - $ref: "#/components/schemas/ValuationPointSummary"
            - type: "null"
        endPoint:
          oneOf:
            - $ref: "#/components/schemas/ValuationPointSummary"
            - type: "null"
