openapi: 3.1.0
info:
  title: Plutus API
  version: 0.1.0
  description: Transport contract for authentication, portfolios, identities with embedded connections, collection cycles, holdings, history, capital flows, catalog, and audit.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process can serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      summary: Process readiness
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthNotReady"
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Issue or rotate a CSRF token
      security: []
      responses:
        "200":
          description: CSRF token for the current pre-auth or session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      security:
        - csrfHeader: []
      tags: [auth]
      summary: Authenticate with username and password
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      security:
        - sessionCookie: []
          csrfHeader: []
      tags: [auth]
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      security:
        - sessionCookie: []
          csrfHeader: []
      tags: [auth]
      summary: Revoke all sessions for the current user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: All sessions revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current user and session summary
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/password:
    put:
      operationId: putAuthPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      tags: [auth]
      summary: Replace the current password
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password replaced.
        "422":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: List the current user's sessions
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: deleteAuthSession
      security:
        - sessionCookie: []
          csrfHeader: []
      tags: [auth]
      summary: Revoke one owned session
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios:
    get:
      operationId: listPortfolios
      tags:
        - portfolios
      summary: List owned portfolios
      responses:
        "200":
          description: Owned portfolios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioList"
        "401":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPortfolio
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - portfolios
      summary: Create a portfolio
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Portfolio created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}:
    get:
      operationId: getPortfolio
      tags:
        - portfolios
      summary: Get a portfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: The portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchPortfolio
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - portfolios
      summary: Update portfolio settings
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPortfolioRequest"
      responses:
        "200":
          description: Updated portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePortfolio
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - portfolios
      summary: Delete an additional portfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Deletion accepted; cleanup continues in the background.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/platforms:
    get:
      operationId: listPlatforms
      tags: [identities]
      summary: List supported platforms with their account structures, account types, and margin modes
      responses:
        "200":
          description: Supported platforms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformList"
        "401":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities:
    get:
      operationId: listIdentities
      tags:
        - identities
      summary: List identities with their accounts and connection state
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIdentity
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Create an identity and select its account types
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "201":
          description: Identity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}:
    get:
      operationId: getIdentity
      tags:
        - identities
      summary: Get an identity
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
      responses:
        "200":
          description: The identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchIdentity
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Rename an identity or change account selection
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchIdentityRequest"
      responses:
        "200":
          description: Updated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/archive:
    post:
      operationId: archiveIdentity
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Archive an identity; refused while its connection is enabled
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Archived identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/connection/credentials:
    put:
      operationId: putIdentityCredentials
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Store read-only API credentials (write-only)
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutCredentialsRequest"
      responses:
        "200":
          description: Credentials stored; the connection is disabled until enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteIdentityCredentials
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Remove stored credentials
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Credentials removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/connection/validate:
    post:
      operationId: validateIdentityConnection
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Run one read-only validation call and store the outcome
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Validation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOutcome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/connection/enable:
    post:
      operationId: enableIdentityConnection
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Validate and enable the connection for scheduling
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Connection enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOutcome"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/connection/disable:
    post:
      operationId: disableIdentityConnection
      security:
        - sessionCookie: []
          csrfHeader: []
      tags:
        - identities
      summary: Stop scheduling the connection
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/EditVersion"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Connection disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/collection-cycles:
    get:
      operationId: listCollectionCycles
      tags: [collection]
      summary: List collection cycles with their valuation points
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Collection cycles, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCycleList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCollectionCycle
      security:
        - sessionCookie: []
          csrfHeader: []
      tags: [collection]
      summary: Enqueue a manual collection cycle or return the active one
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: The queued or running cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCycle"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/collection-cycles/{cycleId}:
    get:
      operationId: getCollectionCycle
      tags: [collection]
      summary: Get one cycle with its per-account outcomes
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/CycleID"
      responses:
        "200":
          description: The cycle.
