      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ConnectionID:
      name: connectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ObservationID:
      name: observationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    FlowID:
      name: flowId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SessionID:
      name: sessionId
      in: path
      required: true
