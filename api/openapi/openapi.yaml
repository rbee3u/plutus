openapi: 3.1.0
info:
  title: Plutus API
  version: 0.1.0
  description: Transport contract for authentication, Portfolios, Identities with embedded Connections, Collection Cycles, holdings, history, Capital Flows, catalog, jobs, and audit.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process can serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      summary: Process readiness
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthNotReady"
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Issue or rotate a CSRF token
      security: []
      responses:
        "200":
          description: CSRF token for the current pre-auth or session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Authenticate with username and password
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      tags: [auth]
      summary: Revoke all sessions for the current user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: All sessions revoked.
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current user and session summary
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/password:
    put:
      operationId: putAuthPassword
      tags: [auth]
      summary: Replace the current password
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password replaced.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: List the current user's sessions
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: deleteAuthSession
      tags: [auth]
      summary: Revoke one owned session
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios:
    get:
      operationId: listPortfolios
      tags: [portfolios]
      summary: List owned portfolios
      responses:
        "200":
          description: Owned portfolios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPortfolio
      tags: [portfolios]
      summary: Create a portfolio
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Portfolio created.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}:
    get:
      operationId: getPortfolio
      tags: [portfolios]
      summary: Get a portfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: The portfolio.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchPortfolio
      tags: [portfolios]
      summary: Update portfolio settings
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPortfolioRequest"
      responses:
        "200":
          description: Updated portfolio.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePortfolio
      tags: [portfolios]
      summary: Delete an additional portfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/platforms:
    get:
      operationId: listPlatforms
      tags: [identities]
      summary: List supported platforms with their Account Structures, Account Types, and Margin Modes
      responses:
        "200":
          description: Supported platforms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformList"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities:
    get:
      operationId: listIdentities
      tags: [identities]
      summary: List identities with their accounts and connection state
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIdentity
      tags: [identities]
      summary: Create an identity and select its account types
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "201":
          description: Identity created.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}:
    get:
      operationId: getIdentity
      tags: [identities]
      summary: Get an identity
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
      responses:
        "200":
          description: The identity.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchIdentity
      tags: [identities]
      summary: Rename an identity or change account selection
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchIdentityRequest"
      responses:
        "200":
          description: Updated identity.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/archive:
    post:
      operationId: archiveIdentity
      tags: [identities]
      summary: Archive an identity; refused while its connection is enabled
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Archived identity.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/credentials:
    put:
      operationId: putIdentityCredentials
      tags: [identities]
      summary: Store read-only API credentials (write-only)
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutCredentialsRequest"
      responses:
        "200":
          description: Credentials stored; the connection is disabled until enabled.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteIdentityCredentials
      tags: [identities]
      summary: Remove stored credentials
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Credentials removed.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/validate:
    post:
      operationId: validateIdentityConnection
      tags: [identities]
      summary: Run one read-only validation call and store the outcome
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Validation outcome.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOutcome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/enable:
    post:
      operationId: enableIdentityConnection
      tags: [identities]
      summary: Validate and enable the connection for scheduling
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Connection enabled.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOutcome"
        "422":
          description: Validation failed; the connection stays disabled or became invalid.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOutcome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/identities/{identityId}/disable:
    post:
      operationId: disableIdentityConnection
      tags: [identities]
      summary: Stop scheduling the connection
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdentityID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Connection disabled.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/collection-cycles:
    get:
      operationId: listCollectionCycles
      tags: [collection]
      summary: List collection cycles with their valuation points
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Collection cycles, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCycleList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCollectionCycle
      tags: [collection]
      summary: Enqueue a manual collection cycle or return the active one
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: The queued or running cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCycle"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/collection-cycles/{cycleId}:
    get:
      operationId: getCollectionCycle
      tags: [collection]
      summary: Get one cycle with its per-account outcomes
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/CycleID"
      responses:
        "200":
          description: The cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCycleDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/overview:
    get:
      operationId: getOverview
      tags: [holdings]
      summary: Latest valuation point with platform and identity totals
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/tree:
    get:
      operationId: getHoldingsTree
      tags: [holdings]
      summary: Platform → identity → account tree at the latest point
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Holdings tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingsTree"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/accounts/{accountId}/balances:
    get:
      operationId: listAccountBalances
      tags: [holdings]
      summary: Balances of an account's current report
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Account balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/accounts/{accountId}/positions:
    get:
      operationId: listAccountPositions
      tags: [holdings]
      summary: Positions of an account at the latest or a specified Valuation Point
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/AccountID"
        - name: pointId
          in: query
          description: Historical Valuation Point; omitted for the latest point.
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Account positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPositionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/accounts/{accountId}/dual-positions:
    get:
      operationId: listAccountDualPositions
      tags: [holdings]
      summary: Dual positions of an account's current report
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Account positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDualPositionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/balances:
    get:
      operationId: listBalances
      tags: [holdings]
      summary: Flat balance list across the boundary at the latest point
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: platform
          in: query
          schema:
            type: string
        - name: identityId
          in: query
          schema:
            type: string
            format: uuid
        - name: symbol
          in: query
          description: Case-insensitive literal substring of the native listing or mapped Asset Symbol.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/positions:
    get:
      operationId: listPositions
      tags: [holdings]
      summary: Flat position list across the boundary at the latest point
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: platform
          in: query
          schema:
            type: string
        - name: identityId
          in: query
          schema:
            type: string
            format: uuid
        - name: symbol
          in: query
          description: Case-insensitive literal substring of the native contract Symbol.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/portfolios/{portfolioId}/dual-positions:
    get:
      operationId: listDualPositions
      tags: [holdings]
      summary: Flat dual position list across the boundary at the latest point
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: platform
          in: query
          schema:
            type: string
        - name: identityId
          in: query
          schema:
            type: string
            format: uuid
        - name: symbol
          in: query
          description: Case-insensitive literal substring of the invested, Base, or Quote Symbol.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
