    CreateCapitalFlowRequest:
      type: object
      additionalProperties: false
      required: [direction, canonicalAssetSymbol, quantity, effectiveAt]
      description: Positive canonical asset quantity. An explicit nonnegative valueUsd fixes the USD amount. Otherwise pricing uses the account platform or pricingPlatform; unavailable automatic pricing returns a null USD value with its provenance.
      properties:
        direction:
          type: string
          enum: [contribution, withdrawal]
        canonicalAssetSymbol:
          type: string
        quantity:
          $ref: "#/components/schemas/InputDecimal"
        valueUsd:
          $ref: "#/components/schemas/InputDecimal"
        pricingPlatform:
          type: string
        effectiveAt:
          type: string
          format: date-time
        accountId:
          $ref: "#/components/schemas/UUID"
        note:
          type: string
          maxLength: 500
    PatchCapitalFlowRequest:
      type: object
      additionalProperties: false
      description: >-
        Omitted fields preserve their values. Null clears note or accountId;
        valueUsd null clears an explicit amount and attempts automatic pricing
        using the resulting inputs. Explicit valueUsd survives other edits until
        cleared or replaced. Null pricingPlatform clears the chosen platform;
        an attached account still determines the platform for automatic pricing.
        Note-only edits preserve pricing provenance. Quantity must be positive;
        an explicit USD amount must be nonnegative.
      properties:
        direction:
          type: string
          enum: [contribution, withdrawal]
        canonicalAssetSymbol:
          type: string
        quantity:
          $ref: "#/components/schemas/InputDecimal"
        valueUsd:
          $ref: "#/components/schemas/NullableInputDecimal"
        pricingPlatform:
          type: [string, "null"]
        effectiveAt:
          type: string
          format: date-time
        accountId:
          type: [string, "null"]
          format: uuid
        note:
          maxLength: 500
          type: [string, "null"]
