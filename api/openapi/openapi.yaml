components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: plutus_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    PortfolioID:
      name: portfolioId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    IdentityID:
      name: identityId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AccountID:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    CycleID:
      name: cycleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    PointID:
      name: pointId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    FlowID:
      name: flowId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SessionID:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ListingID:
      name: listingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TimeFrom:
      name: from
      in: query
      description: Start of the window. Omitted, a period list starts at the later of its default span and the first Valuation Point.
      schema:
        type: string
        format: date-time
    TimeTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    PeriodKind:
      name: periodKind
      in: query
      schema:
        $ref: "#/components/schemas/PeriodKind"
  responses:
    Problem:
      description: Problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    UUID:
      type: string
      format: uuid
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    HealthReady:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    HealthNotReady:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [not_ready]
        reason:
          type: string
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthSession:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required: [id, username, status]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, sessionCount]
      properties:
        user:
          $ref: "#/components/schemas/User"
        sessionCount:
          type: integer
          minimum: 0
    Session:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        clientLabel:
          type: [string, "null"]
        current:
          type: boolean
    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Portfolio:
      type: object
      additionalProperties: false
      required: [id, name, timezone, collectionIntervalSeconds, undeletable, version, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        timezone:
          type: string
        collectionIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        undeletable:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PortfolioList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
    CreatePortfolioRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
        collectionIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
    PatchPortfolioRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
        collectionIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
    Platform:
      type: object
      additionalProperties: false
      required: [id, name, adapterAvailable, accountStructures]
      properties:
        id:
          type: string
        name:
          type: string
        adapterAvailable:
          type: boolean
        accountStructures:
          type: array
          items:
            $ref: "#/components/schemas/AccountStructure"
    AccountStructure:
      type: object
      additionalProperties: false
      description: >-
        How the Platform arranges an Identity's Accounts. It decides the Account Types, is chosen
        when the Identity is created, and cannot be changed afterwards.
      required: [id, name, accountTypes, marginModes]
      properties:
        id:
          type: string
        name:
          type: string
        accountTypes:
          type: array
          items:
            $ref: "#/components/schemas/AccountTypeInfo"
        marginModes:
          description: Margin Modes the Platform may report within this structure; empty when it has none.
          type: array
          items:
            $ref: "#/components/schemas/MarginModeInfo"
    AccountTypeInfo:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    MarginModeInfo:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    PlatformList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
    Connection:
