version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - iotamixing
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
      disabled-checks:
        - builtinShadowDecl
        - codegenComment
        - commentedOutCode
        - deprecatedComment
        - emptyDecl
        - unnecessaryDefer
    govet:
      enable:
        - nilness
        - unusedwrite
    staticcheck:
      checks:
        - SA*
        - -SA6*
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [forcetypeassert]
      - path: _test\.go$
        linters: [gosec]
        text: "^G(101|304):"
