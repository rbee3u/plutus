version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - iotamixing
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
      disabled-checks:
        - builtinShadowDecl
        - codegenComment
        - commentedOutCode
        - deprecatedComment
        - emptyDecl
        - unnecessaryDefer
    govet:
      enable:
        - nilness
        - unusedwrite
    staticcheck:
      checks:
        - SA*
        - -SA6*
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Forward legacy SQL driver interfaces for compatibility.
      - path: ^internal/infra/mysql/sql_logging\.go$
        linters: [staticcheck]
        text: "^SA1019:"
      # Unexpected fixture shapes should fail the test.
      - path: _test\.go$
        linters: [forcetypeassert]
      # Tests use invented credentials and test-owned paths.
      - path: _test\.go$
        linters: [gosec]
        text: "^G(101|304):"
      # Incoming cookies carry no server flags; those are asserted separately.
      - path: ^internal/transport/http/auth_test\.go$
        linters: [gosec]
        text: "^G124:"
      # Verify the network guard rejects a forbidden URL.
      - path: ^internal/adapters/offline/default_test\.go$
        linters: [gosec]
        text: "^G704:"
