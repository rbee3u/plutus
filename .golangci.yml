version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - iotamixing
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign
  settings:
    depguard:
      rules:
        runtime:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!${config-path}/internal/testsupport/**"
          deny:
            - pkg: github.com/rbee3u/plutus/internal/testsupport/
              desc: Runtime code must not depend on test infrastructure.
        adapter-contract:
          list-mode: lax
          files:
            - "${config-path}/internal/platform/adapters/**"
            - "!$test"
          allow:
            - github.com/rbee3u/plutus/internal/shared/
          deny:
            - pkg: github.com/rbee3u/plutus/internal/
              desc: The normalized Adapter contract must remain independent of implementations.
        transport:
          list-mode: lax
          files:
            - "${config-path}/internal/transport/**"
            - "!$test"
          deny:
            - pkg: database/sql$
              desc: HTTP delegates database access to application services.
            - pkg: github.com/rbee3u/plutus/internal/infra/mysql/sqlcgen$
              desc: HTTP delegates database access to application services.
        shared:
          list-mode: lax
          files:
            - "${config-path}/internal/shared/**"
            - "!$test"
          allow:
            - github.com/rbee3u/plutus/internal/shared/
          deny:
            - pkg: github.com/rbee3u/plutus/internal/
              desc: Keep shared dependencies within its documented architectural boundary.
        infra:
          list-mode: lax
          files:
            - "${config-path}/internal/infra/**"
            - "!$test"
          allow:
            - github.com/rbee3u/plutus/internal/infra/
            - github.com/rbee3u/plutus/internal/shared/
          deny:
            - pkg: github.com/rbee3u/plutus/internal/
              desc: Keep infra dependencies within its documented architectural boundary.
        platform:
          list-mode: lax
          files:
            - "${config-path}/internal/platform/**"
            - "!$test"
          allow:
            - github.com/rbee3u/plutus/internal/platform/
            - github.com/rbee3u/plutus/internal/shared/
          deny:
            - pkg: github.com/rbee3u/plutus/internal/
              desc: Keep platform dependencies within its documented architectural boundary.
        application:
          list-mode: lax
          files:
            - "${config-path}/internal/application/**"
            - "!$test"
          allow:
            - github.com/rbee3u/plutus/internal/application/
            - github.com/rbee3u/plutus/internal/infra/
            - github.com/rbee3u/plutus/internal/platform/adapters$
            - github.com/rbee3u/plutus/internal/shared/
          deny:
            - pkg: github.com/rbee3u/plutus/internal/
              desc: Keep application dependencies within its documented architectural boundary.
        valuation:
          list-mode: lax
          files:
            - "${config-path}/internal/application/valuation/**"
            - "!$test"
          deny:
            - pkg: github.com/rbee3u/plutus/internal/application/financial
              desc: Valuation must remain independent of financial presentation.
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
      disabled-checks:
        - builtinShadowDecl
        - codegenComment
        - commentedOutCode
        - deprecatedComment
        - emptyDecl
        - unnecessaryDefer
    govet:
      enable:
        - nilness
        - unusedwrite
    staticcheck:
      checks:
        - SA*
        - -SA6*
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Forward legacy SQL driver interfaces for compatibility.
      - path: ^internal/infra/mysql/sql_logging\.go$
        linters: [staticcheck]
        text: "^SA1019:"
      # Unexpected fixture shapes should fail the test.
      - path: _test\.go$
        linters: [forcetypeassert]
      # Tests use invented credentials and test-owned paths.
      - path: _test\.go$
        linters: [gosec]
        text: "^G(101|304):"
      # Incoming cookies carry no server flags; those are asserted separately.
      - path: ^internal/transport/http/auth_test\.go$
        linters: [gosec]
        text: "^G124:"
      # Verify the network guard rejects a forbidden URL.
      - path: ^internal/testsupport/offline/default_test\.go$
        linters: [gosec]
        text: "^G704:"
