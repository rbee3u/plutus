version: "2"

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - iotamixing
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic]
      disabled-tags: [style]
    govet:
      enable: [nilness, unusedwrite]
    staticcheck:
      checks: [SA*]
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [forcetypeassert]
      # Fixed test credentials, identifiers, paths, cookies, TLS settings, and offline targets.
      - path: _test\.go$
        linters: [gosec]
        text: "^G(101|122|124|201|202|204|304|402|702|704):"
      # Committed hashes and labels, trusted paths, credential sealing, and CSRF cookies.
      - path: (internal/seed/builder|internal/platform/adapter/credential_form)\.go
        linters: [gosec]
        text: "^G101:"
      - path: (internal/infra/logging/logging|internal/platform/fixture/fixture)\.go
        linters: [gosec]
        text: "^G304:"
      - path: internal/infra/secret/box\.go
        linters: [gosec]
        text: "^G117:"
      - path: internal/transport/http/cookie\.go
        linters: [gosec]
        text: "^G124:"
