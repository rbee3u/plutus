version: "2"
sql:
  - engine: mysql
    schema:
      - db/migrations
    queries:
      - db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/infra/mysql/sqlcgen
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: json
            go_type:
              import: "github.com/rbee3u/plutus/internal/infra/sqljson"
              type: "Column"
          - db_type: json
            nullable: true
            go_type:
              import: "github.com/rbee3u/plutus/internal/infra/sqljson"
              type: "Column"
          - column: "identities.credentials_ciphertext"
            go_type:
              type: "[]byte"
          - column: "identities.credentials_nonce"
            go_type:
              type: "[]byte"
          - db_type: binary
            nullable: true
            go_type:
              type: "[]byte"
