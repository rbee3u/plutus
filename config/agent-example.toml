# Agent self-check example. Copy to gitignored config/agent.toml.
# Put the MySQL DSN and a unique master key in gitignored config/agent.env.

[server]
listen_address = "127.0.0.1"
port = 8081

[server.tls]
https_enabled = false
https_cert_path = ""
https_key_path = ""
mtls_enabled = false
mtls_ca_path = ""

[auth]
registration_enabled = false
session_idle_lifetime = "168h"
session_absolute_lifetime = "720h"
session_cookie_name = "plutus_session_agent"
csrf_cookie_name = "plutus_csrf_agent"

[jobs]
worker_poll_interval = "1s"
lease_duration = "2m"
completed_retention = "2160h"

[collection]
default_interval = "15m"
default_freshness_multiplier = 2

[database]
allow_reset = true
