# agent environment: see docs/development.md for environment boundaries.
# Copy to gitignored config/agent.toml; put secrets in config/agent.env.
# See docs/development.md#configuration for optional settings and defaults.

[server]
listen_address = "0.0.0.0"
port = 8081

[logging]
directory = "./logs"
level = "info"

[database]
# Reset drops all tables and reapplies migrations; never enable it on prod.
allow_reset = true

[auth]
# Both session and CSRF cookies use this suffix; ports do not isolate cookies.
cookie_suffix = "agent"

[collection]
# Dev uses the deterministic offline Adapter; test and prod use live Adapters.
fake_adapter = true

[collection.proxy]
# environment preserves HTTP_PROXY/HTTPS_PROXY/NO_PROXY from the process environment.
# direct ignores environment proxies; proxy requires a URL and ignores NO_PROXY.
mode = "environment"
# A local sing-box HTTP/SOCKS entry point can forward through an external SS tunnel.
# Set mode = "proxy" before configuring the URL; usernames and passwords are not accepted.
# url = "http://127.0.0.1:7890"
