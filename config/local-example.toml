# Local development example. Copy to gitignored config/local.toml.
# Put the MySQL DSN and master key in gitignored config/local.env.

[server]
listen_address = "127.0.0.1"
port = 8080

[server.tls]
https_enabled = false
https_cert_path = ""
https_key_path = ""
mtls_enabled = false
mtls_ca_path = ""

[auth]
registration_enabled = false
session_idle_lifetime = "168h"
session_absolute_lifetime = "720h"
session_cookie_name = "plutus_session_local"
csrf_cookie_name = "plutus_csrf_local"

[jobs]
worker_poll_interval = "1s"
lease_duration = "2m"
completed_retention = "2160h"

[collection]
default_interval = "15m"
default_freshness_multiplier = 2

[database]
# allow_reset enables the development-only `plutus db reset` command.
allow_reset = false
