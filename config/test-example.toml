# test example: the remote acceptance server, live read-only Platform keys, resettable.
# Copy next to the deployed binary as test.toml and edit by hand. Put the MySQL DSN and a unique
# master key in test.env. Numbers collected here are compared with the exchange apps by hand.

[server]
listen_address = "127.0.0.1"   # put a reverse proxy or SSH tunnel in front, or bind 0.0.0.0 with TLS below
port = 8082

[server.tls]
https_enabled = false
https_cert_path = ""
https_key_path = ""
mtls_enabled = false
mtls_ca_path = ""

[auth]
session_idle_lifetime = "168h"
session_absolute_lifetime = "720h"
session_cookie_name = "plutus_session_test"
csrf_cookie_name = "plutus_csrf_test"

[jobs]
worker_poll_interval = "1s"
lease_duration = "2m"
completed_retention = "2160h"

[collection]
default_interval = "15m"      # Collection Cycle interval for new Portfolios; each Portfolio may override
stagger = "3s"                # delay between Identities within one cycle
validate_timeout = "15s"      # bound for one synchronous Connection validation
fake_adapter = false          # live adapters only; Identities are created in the UI with real read-only keys

[database]
# `plutus db reset` (no --profile) drops and migrates plutus_test so it can be re-collected from scratch.
allow_reset = true
