# test environment: see docs/development.md for environment boundaries.
# Copy to test.toml; keep the DSN and a unique master key in test.env.
# See docs/development.md#configuration for optional settings and defaults.

[server]
listen_address = "0.0.0.0"
port = 8082

[server.tls]
# Require client certificates trusted by client-ca.pem.
cert_file = "server.pem"
key_file = "server-key.pem"
client_ca_file = "client-ca.pem"

[logging]
directory = "./logs"
level = "info"

[database]
# Reset drops all tables and reapplies migrations; never enable it on prod.
allow_reset = true

[auth]
# Both session and CSRF cookies use this suffix; ports do not isolate cookies.
cookie_suffix = "test"

[collection]
# Dev uses the deterministic offline Adapter; test and prod use live Adapters.
fake_adapter = false
